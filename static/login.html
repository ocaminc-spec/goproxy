<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoProxy DNS · Sign in</title>
<style>
:root{--bg:#0b0d10;--surface:#15181d;--edge:#262a31;--text:#e8eaed;--muted:#9aa0a6;--accent:#4a9eff;--red:#ff5c5c}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--surface:#fff;--edge:#e3e5e8;--text:#15181d;--muted:#5f6368}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:28px;width:100%;max-width:380px}
h1{font-size:20px;margin:0 0 4px}.logo{color:var(--accent);margin-right:6px}p{color:var(--muted);margin:0 0 18px;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--edge);background:var(--bg);color:var(--text);font-size:15px}
button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
#err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}.hidden{display:none}
</style></head><body>
<form class="card" id="f" autocomplete="on">
<h1><span class="logo">◆</span>GoProxy DNS</h1>
<p id="intro">Sign in to the dashboard.</p>
<label for="u">Username</label><input id="u" name="username" autocomplete="username" required maxlength="64" autocapitalize="none">
<label for="p">Password</label><input id="p" name="password" type="password" required minlength="8" maxlength="72">
<div id="p2w" class="hidden"><label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password" minlength="8" maxlength="72"></div>
<button id="b" type="submit">Sign in</button><div id="err" role="alert"></div>
</form>
<script>
const $=id=>document.getElementById(id);let setup=false;
fetch("/api/auth/status",{cache:"no-store"}).then(r=>r.json()).then(s=>{
 if(s.user){location.replace("/");return}
 if(!s.configured){setup=true;$("intro").textContent=s.setup_allowed?"First run: create the username and password that will protect this dashboard. There is no default login.":"First-time setup is only possible from this PC or the home network.";$("b").textContent="Create login";$("p2w").classList.remove("hidden");$("p").autocomplete="new-password";$("p2").required=true;if(!s.setup_allowed)$("b").disabled=true}
 else{$("p").autocomplete="current-password"}});
$("f").onsubmit=async e=>{e.preventDefault();$("err").textContent="";
 if(setup&&$("p").value!==$("p2").value){$("err").textContent="Passwords don’t match.";return}
 $("b").disabled=true;try{const r=await fetch(setup?"/api/auth/setup":"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});
 const j=await r.json().catch(()=>({}));if(r.ok&&j.ok){location.replace("/");return}$("err").textContent=j.error||("Error "+r.status)}catch(x){$("err").textContent="Can’t reach GoProxy."}$("b").disabled=false};
</script></body></html>
